<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة وقت الريشة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f3f7f5;color:#17352e}header{background:white;padding:16px 5%;border-bottom:1px solid #dbe6e2;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #dbe6e2;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;padding:18px;border-radius:14px;border:1px solid #dbe6e2}.stat b{font-size:28px;display:block;margin-top:7px}input,select,textarea{width:100%;padding:11px;border:1px solid #cad8d3;border-radius:9px;margin:6px 0 12px}button{padding:11px 16px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.p{background:#08705a;color:white}.s{background:#e5f2ed;color:#08705a}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e8eeeb;text-align:right}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.msg{padding:11px;border-radius:9px;background:#edf7f3;margin:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><header><b>منصة وقت الريشة 🏸</b><span id="who">Shuttle Time Schools</span></header><main class="wrap">
<section id="login" class="card"><h2>تسجيل الدخول</h2><p>أدخل البريد الإلكتروني. سيصلك رابط آمن للدخول بدون كلمة مرور.</p><input id="email" type="email" placeholder="email@example.com"><button class="p" onclick="magic()">إرسال رابط الدخول</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><div class="card"><h2 id="hello">لوحة المتابعة</h2><div id="scope"></div><button class="s" onclick="logout()">تسجيل الخروج</button></div>
<div class="grid"><div class="stat">المدارس<b id="kSchools">—</b></div><div class="stat">الطلاب<b id="kStudents">—</b></div><div class="stat">الحصص<b id="kSessions">—</b></div><div class="stat">الترشيحات<b id="kTalent">—</b></div></div>
<div class="card" style="margin-top:16px"><div class="tabs"><button class="p" onclick="panel('schools')">المدارس</button><button class="s" onclick="panel('students')">الطلاب</button><button class="s" onclick="panel('attendance')">الحضور والحصة</button></div>
<div id="schools" class="pane"><h3>المدارس</h3><div id="schoolsList"></div></div>
<div id="students" class="pane hidden"><h3>إضافة طالب/ة</h3><select id="studentSchool"></select><input id="studentName" placeholder="اسم الطالب/ة"><select id="studentGender"><option>بنين</option><option>بنات</option></select><input id="studentGrade" placeholder="الصف"><button class="p" onclick="addStudent()">حفظ</button><div id="studentsList"></div></div>
<div id="attendance" class="pane hidden"><h3>تسجيل الحضور وتنفيذ الحصة</h3><select id="reportSchool" onchange="loadSchoolStudents()"></select><select id="programSession"></select><input id="sessionDate" type="date"><select id="execution"><option value="completed">تم بالكامل</option><option value="partial">تم جزئيًا</option><option value="not_completed">لم تنفذ</option></select><button class="s" onclick="allPresent()">تحديد الجميع حاضر</button><div id="attList"></div><textarea id="note" placeholder="ملاحظة مختصرة"></textarea><input id="evidenceFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="p" onclick="saveReport()">حفظ وإرسال الحصة</button><div id="reportMsg"></div></div></div></section></main>
<script>
const SB=supabase.createClient("https://xgfhxcqkvsdnnfleumfd.supabase.co","sb_publishable_VROAX7YVhc4IBFXuEyULWw_EVRtnMSP"); let profile=null, schools=[];
function msg(id,t){document.getElementById(id).innerHTML='<div class="msg">'+t+'</div>'}
async function magic(){let e=email.value.trim();if(!e)return;let {error}=await SB.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg('loginMsg',error?error.message:'تم إرسال رابط الدخول إلى بريدك ✓')}
async function logout(){await SB.auth.signOut();location.reload()}
function panel(id){document.querySelectorAll('.pane').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
async function boot(){let {data:{session}}=await SB.auth.getSession();if(!session)return;login.classList.add('hidden');app.classList.remove('hidden');let {data:p}=await SB.from('profiles').select('*').eq('id',session.user.id).single();profile=p;if(!p){msg('scope','الحساب موجود، لكنه يحتاج تعيين صلاحية من الإدارة.');return}hello.textContent='مرحبًا، '+(p.full_name||session.user.email);scope.textContent='الصلاحية: '+p.role;await loadSchools();await loadSessions();await dashboard()}
async function loadSchools(){let {data}=await SB.from('schools').select('id,code,name_ar,stage,teacher_name,regions(name_ar)').order('code');schools=data||[];schoolsList.innerHTML='<table><tr><th>الرمز</th><th>المدرسة</th><th>المنطقة</th><th>المعلم/ة</th></tr>'+schools.map(x=>`<tr><td>${x.code}</td><td>${x.name_ar}</td><td>${x.regions?.name_ar||''}</td><td>${x.teacher_name||''}</td></tr>`).join('')+'</table>';let opts=schools.map(x=>`<option value="${x.id}">${x.code} — ${x.name_ar}</option>`).join('');studentSchool.innerHTML=opts;reportSchool.innerHTML=opts;kSchools.textContent=schools.length}
async function loadSessions(){let {data}=await SB.from('program_sessions').select('*').order('session_no');programSession.innerHTML=(data||[]).map(x=>`<option value="${x.id}">الأسبوع ${x.week_no} — الحصة ${x.day_no} — ${x.title_ar}</option>`).join('')}
async function dashboard(){let {data}=await SB.from('admin_dashboard').select('*').maybeSingle();if(data){kSchools.textContent=data.active_schools;kStudents.textContent=data.registered_students;kSessions.textContent=data.sessions_delivered;kTalent.textContent=data.talent_nominations}}
async function addStudent(){let payload={school_id:studentSchool.value,full_name:studentName.value.trim(),gender:studentGender.value,grade:studentGrade.value};if(!payload.full_name)return alert('أدخل الاسم');let {error}=await SB.from('students').insert(payload);if(error)return alert(error.message);studentName.value='';studentGrade.value='';await dashboard();alert('تم حفظ الطالب/ة ✓')}
async function loadSchoolStudents(){let {data,error}=await SB.from('students').select('id,student_code,full_name').eq('school_id',reportSchool.value).order('full_name');if(error)return;attList.innerHTML=(data||[]).map(x=>`<label style="display:block;padding:8px;border-bottom:1px solid #eee"><input class="att" type="checkbox" data-id="${x.id}" style="width:auto"> ${x.full_name}</label>`).join('')||'<div class="msg">لا يوجد طلاب مسجلون لهذه المدرسة.</div>'}
function allPresent(){document.querySelectorAll('.att').forEach(x=>x.checked=true)}
async function saveReport(){let checked=[...document.querySelectorAll('.att')], date=sessionDate.value||new Date().toISOString().slice(0,10);let {data:r,error}=await SB.from('session_reports').upsert({school_id:reportSchool.value,session_id:+programSession.value,session_date:date,execution:execution.value,note:note.value,submitted_by:profile.id},{onConflict:'school_id,session_id'}).select().single();if(error)return msg('reportMsg',error.message);await SB.from('attendance').delete().eq('report_id',r.id);if(checked.length){let a=checked.map(x=>({report_id:r.id,student_id:x.dataset.id,present:x.checked}));let z=await SB.from('attendance').insert(a);if(z.error)return msg('reportMsg',z.error.message)}let f=evidenceFile.files[0];if(f){let path=`${reportSchool.value}/${r.id}/${Date.now()}-${f.name}`;let u=await SB.storage.from('session-evidence').upload(path,f);if(!u.error)await SB.from('evidence').insert({report_id:r.id,storage_path:path,uploaded_by:profile.id})}msg('reportMsg','تم تسجيل الحصة والحضور بنجاح ✓');await dashboard()}
SB.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script></body></html>
